services:
  # Backend Node/Express API
  - type: web
    name: agrierp-backend
    env: node
    plan: free
    rootDir: anti_agri/server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
        placeholder: "Paste your MongoDB Atlas connection string here"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        fromService:
          type: web
          name: agrierp-frontend
          property: url

  # Frontend React SPA
  - type: web
    name: agrierp-frontend
    env: static
    plan: free
    rootDir: anti_agri/client
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: agrierp-backend
          property: url


